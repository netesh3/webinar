# The whole product on one server, behind automatic TLS.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Six containers, one public port pair (80/443) plus the SFU's media ports. Sized
# for the 500-concurrent-attendee ceiling: only the host and panelists publish, so
# the load is egress — roughly 500 × 2 Mbps ≈ 1 Gbps. One box with unmetered
# gigabit handles it; past that you add the LL-HLS tier rather than more SFU nodes.
#
# What is deliberately NOT published: Postgres and Redis. They are reachable only
# on the compose network, because a database on the public internet with a password
# is a database that will eventually be found.

name: webcast

services:
  # ---------------------------------------------------------------- edge
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 80 is not optional even though everything is HTTPS: the ACME HTTP challenge
    # uses it, and Caddy redirects to 443 from it.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that — so it is a named volume, not a bind.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - livekit

  # ---------------------------------------------------------------- app
  web:
    build:
      context: ./web
      args:
        # Empty on purpose: the browser then calls /api on the origin that served
        # the page, so no hostname is baked into the bundle. See web/Dockerfile.
        NEXT_PUBLIC_API_BASE: ""
    restart: unless-stopped
    environment:
      # Server Components render before there is an origin, so they call the API
      # directly over this network rather than back out through Caddy.
      API_INTERNAL_URL: http://api:8080
    expose:
      - "3000"

  # One-shot: give the recordings volume to the uid the API runs as.
  #
  # A named volume is created root-owned, and the API image is distroless and runs as
  # uid 65532, so it cannot write there. It refuses to boot rather than start and
  # silently record nothing — which is the right behaviour and exactly how this was
  # found. The Kubernetes manifests solve it with `fsGroup: 65532`; compose has no
  # equivalent, so it takes an init container.
  recordings-init:
    image: alpine:3
    user: "0:0"
    command: ["chown", "-R", "65532:65532", "/data/recordings"]
    volumes:
      - recordings:/data/recordings

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      APP_ENV: production
      ADDR: ":8080"
      DATABASE_URL: postgres://webcast:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/webcast?sslmode=disable
      # wss:// and a real hostname, both enforced at boot. A ws:// SFU on an
      # https:// page is blocked as mixed content and presents as a hang.
      LIVEKIT_URL: wss://sfu.${DOMAIN}
      # The room API, reached over the compose network instead of back out through
      # Caddy. Without this it is derived from LIVEKIT_URL above, which means every
      # mute and permission change does a TLS handshake against this same host —
      # and fails outright if sfu.$DOMAIN does not resolve from inside the network.
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      COOKIE_SECURE: "true"
      # One origin, so this is only ever exercised by a stray client. WEB_BASE_URL
      # is what share links are built from.
      CORS_ORIGINS: https://${DOMAIN}
      WEB_BASE_URL: https://${DOMAIN}
      APP_NAME: ${APP_NAME:-Webcast}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SIGNUP_OPEN: ${SIGNUP_OPEN:-true}
      MAX_ATTENDEES: ${MAX_ATTENDEES:-500}
      JOIN_RATE_PER_MIN: ${JOIN_RATE_PER_MIN:-1200}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-10}
      RECORDINGS_ENABLED: ${RECORDINGS_ENABLED:-true}
      RECORDINGS_DIR: /data/recordings
      MAX_RECORDING_MB: ${MAX_RECORDING_MB:-4096}
    volumes:
      # The one thing this service writes. NewDisk write-probes it at startup, so a
      # permissions problem is a boot failure rather than a webinar that records
      # nothing for forty minutes.
      - recordings:/data/recordings
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      recordings-init:
        condition: service_completed_successfully
    # No healthcheck: the image is distroless, so there is no shell and no curl to
    # run one with. /readyz exists for a load balancer that can probe from outside.

  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: webcast
      # Deterministic collation, so ORDER BY does not shift between machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcast -d webcast"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # LiveKit uses Redis for node coordination. Nothing here needs to survive a
    # restart, so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- media
  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Keys come from the environment so no secret is in the config file or in
      # git. LiveKit reads this as "key: secret" pairs.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # The hostname TURN advertises itself as. Interpolated into the config file
      # rather than hardcoded, so one image serves any deployment.
      TURN_DOMAIN: turn.${DOMAIN}
    volumes:
      - ./infra/livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      # Media does NOT go through Caddy — it cannot, it is not HTTP. These have to
      # reach the container directly, so they are published and must be open in the
      # server's firewall and in any cloud security group.
      #
      # Without the UDP range you connect and see black video. Without the TCP
      # fallback, roughly 15% of corporate attendees cannot join at all.
      - "7881:7881"                     # ICE over TCP
      - "50000-50060:50000-50060/udp"   # RTP/RTCP
      # TURN. A relay candidate is the one candidate that always works, which is
      # what stops ICE from spending tens of seconds proving that nothing else does.
      # See the long note in infra/livekit.prod.yaml — this is the difference
      # between a two-second join and a two-minute one on an awkward network.
      - "3478:3478/udp"                 # TURN over UDP
    depends_on:
      redis:
        condition: service_healthy
    # Signalling (7880) is not published: Caddy terminates TLS for it at
    # sfu.${DOMAIN} and proxies over this network, which is how the browser gets a
    # wss:// URL without LiveKit having to hold a certificate.

volumes:
  pgdata:
  recordings:
  caddy_data:
  caddy_config:
