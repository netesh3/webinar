<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'"
    />
    <title>Share your screen</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header>
      <h1>Share your screen</h1>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-kind="screen" aria-selected="true">Entire screen</button>
        <button type="button" role="tab" data-kind="window" aria-selected="false">Window</button>
      </div>
    </header>

    <div id="permission" class="notice" hidden>
      <span>Webinar Liv needs Screen Recording permission. Allow it in System Settings, then quit and reopen the app.</span>
      <button type="button" id="open-settings">Open System Settings</button>
    </div>

    <main id="grid" role="listbox" aria-label="Sources"></main>
    <p id="empty" class="empty" hidden>Nothing to share here.</p>

    <footer>
      <label id="audio-row" hidden>
        <input type="checkbox" id="audio" />
        Share system audio
      </label>
      <span class="spacer"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="button" id="share" class="primary" disabled>Share</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
