<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Sharing — Webinar Liv</title>
    <link rel="stylesheet" href="share-bar.css" />
  </head>
  <body>
    <div class="bar">
      <span class="dot" aria-hidden="true"></span>
      <span class="label">Sharing your screen</span>
      <span id="elapsed" class="elapsed">0:00</span>
      <button type="button" id="stop">Stop sharing</button>
    </div>
    <script src="share-bar.js"></script>
  </body>
</html>
