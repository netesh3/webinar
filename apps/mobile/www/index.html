<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cff">
  <title>Can't reach Webinar Liv</title>
  <!-- Bundled in the app (capacitor.config.ts server.errorPath). Shown when
       https://webinarliv.com does not load: no connection, DNS, or an outage.
       Self-contained on purpose: nothing here may need the network. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fa; color: #131619;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 1rem 0 .25rem; }
    p { color: #5c6670; margin: 0 0 1.25rem; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #0b5cff; border: 0;
      border-radius: 10px; padding: .65rem 1.2rem; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d11; color: #eceef1; }
      p { color: #a4abb3; }
    }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="">
    <h1>Can't reach Webinar Liv</h1>
    <p id="why">Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    var SITE = "https://webinarliv.com/";
    function retry() { window.location.replace(SITE); }
    document.getElementById("retry").addEventListener("click", retry);
    if (navigator.onLine === false) {
      // Come back by itself as soon as the connection does.
      window.addEventListener("online", retry, { once: true });
    } else {
      document.getElementById("why").textContent =
        "The site didn't load. It may be a brief outage, or a slow connection. Try again in a moment.";
    }
  </script>
</body>
</html>
