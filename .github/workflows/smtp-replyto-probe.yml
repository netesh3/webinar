# One-off send test. workflow_dispatch only — it does not run on push.
# Uses the repo SMTP secrets as environment variables and never prints them.
name: SMTP reply-to probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Send one test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smtpprobe"
          cat > "$RUNNER_TEMP/smtpprobe/main.go" << 'EOF'
          package main

          import (
          	"crypto/tls"
          	"fmt"
          	"net"
          	"net/mail"
          	"net/smtp"
          	"os"
          	"strings"
          	"time"
          )

          func main() {
          	host := os.Getenv("SMTP_HOST")
          	port := os.Getenv("SMTP_PORT")
          	user := os.Getenv("SMTP_USERNAME")
          	pass := os.Getenv("SMTP_PASSWORD")
          	fromRaw := os.Getenv("SMTP_FROM")
          	if host == "" || port == "" || fromRaw == "" {
          		fmt.Println("SMTP_RESULT missing_config")
          		os.Exit(1)
          	}
          	from := fromRaw
          	if a, err := mail.ParseAddress(fromRaw); err == nil {
          		from = a.Address
          	}
          	addr := net.JoinHostPort(host, port)
          	d := net.Dialer{Timeout: 20 * time.Second}
          	conn, err := d.Dial("tcp", addr)
          	if err != nil {
          		fmt.Println("SMTP_RESULT connect_failed", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	defer conn.Close()
          	c, err := smtp.NewClient(conn, host)
          	if err != nil {
          		fmt.Println("SMTP_RESULT client_failed", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	defer c.Close()
          	if err = c.StartTLS(&tls.Config{ServerName: host}); err != nil {
          		fmt.Println("SMTP_RESULT starttls_failed", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	if user != "" {
          		if err = c.Auth(smtp.PlainAuth("", user, pass, host)); err != nil {
          			fmt.Println("SMTP_RESULT auth_failed", redact(err.Error(), user, pass, fromRaw))
          			os.Exit(1)
          		}
          		fmt.Println("SMTP_RESULT auth_ok")
          	}
          	if err = c.Mail(from); err != nil {
          		fmt.Println("SMTP_RESULT mail_from_rejected", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	if err = c.Rcpt("ganesh.s.p006@gmail.com"); err != nil {
          		fmt.Println("SMTP_RESULT rcpt_rejected", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	w, err := c.Data()
          	if err != nil {
          		fmt.Println("SMTP_RESULT data_rejected", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	msg := "From: " + fromRaw + "\r\n" +
          		"To: ganesh.s.p006@gmail.com\r\n" +
          		"Reply-To: gsp@webinarliv.com\r\n" +
          		"Subject: WebinarLiv inbox test — please reply\r\n" +
          		"MIME-Version: 1.0\r\n" +
          		"Content-Type: text/plain; charset=utf-8\r\n" +
          		"\r\n" +
          		"This is a WebinarLiv inbox test.\r\n" +
          		"Please reply to this email. Your reply should go to gsp@webinarliv.com.\r\n"
          	if _, err = w.Write([]byte(msg)); err != nil {
          		fmt.Println("SMTP_RESULT write_failed", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	if err = w.Close(); err != nil {
          		fmt.Println("SMTP_RESULT not_accepted", redact(err.Error(), user, pass, fromRaw))
          		os.Exit(1)
          	}
          	fmt.Println("SMTP_RESULT accepted")
          	_ = c.Quit()
          }

          func redact(s, user, pass, from string) string {
          	for _, secret := range []string{pass, user, from} {
          		if secret != "" {
          			s = strings.ReplaceAll(s, secret, "[redacted]")
          		}
          	}
          	return s
          }
          EOF
          cd "$RUNNER_TEMP/smtpprobe"
          go mod init probe
          go run .
