# One-shot: print LiveKit Egress logs from the Hetzner box using the existing
# deploy SSH secrets. Does not restart anything.
#
# Actions → "Hetzner egress logs" → Run workflow.

name: Hetzner egress logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${HETZNER_SSH_HOST}" ] || [ -z "${HETZNER_SSH_PRIVATE_KEY}" ]; then
            echo "HETZNER_SSH_HOST and HETZNER_SSH_PRIVATE_KEY must be set." >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hetzner_deploy"
          chmod 600 "$HOME/.ssh/hetzner_deploy"
          host_only="${HETZNER_SSH_HOST#*@}"
          user_part="${HETZNER_SSH_HOST%%@*}"
          if [ "$user_part" = "$HETZNER_SSH_HOST" ]; then
            user_part=root
          fi
          ssh-keyscan -H "$host_only" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          {
            echo "Host livekit-hetzner"
            echo "  HostName ${host_only}"
            echo "  User ${user_part}"
            echo "  IdentityFile ${HOME}/.ssh/hetzner_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Egress capacity and rejections
        run: |
          ssh livekit-hetzner 'set +e
            echo "===== cores / load ====="
            nproc; uptime
            echo
            echo "===== per-container CPU right now ====="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
            echo
            echo "===== egress cpu_cost config (blank = LiveKit defaults) ====="
            grep -iA8 "cpu_cost" /opt/livekit/egress.yaml || echo "no cpu_cost block: defaults apply (room_composite = 3.0 CPU)"
            echo
            echo "===== egress node: what it thinks it can accept ====="
            eg="$(docker ps -a --format "{{.Names}}" | grep -E "egress" | head -1)"
            docker logs "$eg" 2>&1 | grep -iE "cannot accept|not accepting|insufficient|cpu hold|denied|unavailable|cpu_cost|available cpu" | tail -40
            echo
            echo "===== every FILE-output (recording) egress ever requested ====="
            docker logs "$eg" 2>&1 | grep -E "request validated" | grep -oE "outputType\": \"[a-z]+\"" | sort | uniq -c
            docker logs "$eg" 2>&1 | grep -E "\"outputType\": \"file\"" | tail -20 || echo "(no file-output egress in retained logs)"
            echo
            echo "===== livekit-server: egress requests it could not place ====="
            lk="$(docker ps -a --format "{{.Names}}" | grep -E "livekit" | grep -v egress | head -1)"
            docker logs --tail 3000 "$lk" 2>&1 | grep -iE "egress|no available|unavailable" | tail -60
          '

      - name: Print egress logs
        run: |
          ssh livekit-hetzner 'set -e
            echo "===== docker ps ====="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            echo
            echo "===== egress ws_url ====="
            grep -E "^ws_url:" /opt/livekit/egress.yaml || true
            echo
            echo "===== mediamtx logs (last 120 lines) ====="
            mtx="$(docker ps -a --format "{{.Names}}" | grep -E "mediamtx" | head -1)"
            if [ -n "$mtx" ]; then
              docker logs --tail 120 "$mtx" 2>&1
            else
              echo "no mediamtx container found"
            fi
            echo
            echo "===== is anything published? (RTMP 1935 / HLS 8888) ====="
            ss -lntp 2>/dev/null | grep -E "1935|8888" || echo "neither port is listening"
            echo
            echo "===== egress logs (last 400 lines) ====="
            name="$(docker ps -a --format "{{.Names}}" | grep -E "egress" | head -1)"
            if [ -n "$name" ]; then
              echo "container: $name"
              docker logs --tail 400 "$name"
            else
              echo "no egress container found"
              docker ps -a
            fi
          '
