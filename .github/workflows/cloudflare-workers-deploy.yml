# Deploy the Next.js frontend to Cloudflare Workers (OpenNext).
# Secrets must be set on the repo (Settings → Secrets → Actions); never commit them.
#
# Path filters (push to main):
#   - web/**                                      — Next.js app + wrangler / OpenNext config
#   - .github/workflows/cloudflare-workers-deploy.yml
#
# Also: workflow_dispatch (manual) from the Actions tab.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts Edit (and Account read)
#     Create at: https://dash.cloudflare.com/profile/api-tokens
#     Template "Edit Cloudflare Workers" is sufficient.
#
# Required repository variables:
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (wrangler whoami / dashboard)
#
# Build env (set in this workflow; not secrets):
#   NEXT_PUBLIC_API_BASE="" — same-origin /api via Worker proxy (see web/CLOUDFLARE.md)
#   NEXT_PUBLIC_UI_REDESIGN=1 — marketing homepage on logged-out `/`
#   OPEN_NEXT=1
#
# Runtime API target stays in web/wrangler.jsonc vars (API_INTERNAL_URL).

name: Deploy Web (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-workers-deploy.yml"

concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_UI_REDESIGN: "1"
      OPEN_NEXT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Skipping Cloudflare Workers deploy: repository secret CLOUDFLARE_API_TOKEN is not set."
            echo "Create a Workers Edit token at https://dash.cloudflare.com/profile/api-tokens"
            echo "then add it under Settings → Secrets and variables → Actions (see web/CLOUDFLARE.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Skipping Cloudflare Workers deploy: repository variable CLOUDFLARE_ACCOUNT_ID is not set."
            echo "Set it from: npx wrangler whoami (see web/CLOUDFLARE.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.skip != 'true'
        run: npm ci

      - name: Deploy
        if: steps.creds.outputs.skip != 'true'
        run: npm run deploy
