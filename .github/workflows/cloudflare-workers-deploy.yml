# Deploy the Next.js frontend to Cloudflare Workers (OpenNext).
# Secrets must be set on the repo (Settings → Secrets → Actions); never commit them.
#
# Path filters (push to main):
#   - web/**                                      — Next.js app + wrangler / OpenNext config
#   - .github/workflows/cloudflare-workers-deploy.yml
#
# Also: workflow_dispatch (manual) from the Actions tab.
#
# Credentials (either path works):
#   A) CLOUDFLARE_API_TOKEN — API token with Workers Scripts Edit (preferred long-term)
#      Create at: https://dash.cloudflare.com/profile/api-tokens
#   B) CLOUDFLARE_OAUTH_REFRESH_TOKEN — wrangler OAuth refresh token (offline_access)
#      CI exchanges it for a short-lived access token before deploy.
#      Optional: GH_SECRETS_PAT (repo-scoped PAT) so CI can write back rotated refresh tokens.
#
# Required repository variables:
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (wrangler whoami / dashboard)
#   CLOUDFLARE_OAUTH_CLIENT_ID — wrangler public OAuth client id (only needed for path B)
#
# Build env (set in this workflow; not secrets):
#   NEXT_PUBLIC_API_BASE="" — same-origin /api via Worker proxy (see web/CLOUDFLARE.md)
#   NEXT_PUBLIC_UI_REDESIGN=1 — marketing homepage on logged-out `/`
#   OPEN_NEXT=1
#
# Runtime API target stays in web/wrangler.jsonc vars (API_INTERNAL_URL).

name: Deploy Web (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-workers-deploy.yml"

concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_REFRESH_TOKEN }}
      CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.CLOUDFLARE_OAUTH_CLIENT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_UI_REDESIGN: "1"
      OPEN_NEXT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Set repository variable CLOUDFLARE_ACCOUNT_ID (npx wrangler whoami)."
            exit 1
          fi

          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Using CLOUDFLARE_API_TOKEN secret."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${CLOUDFLARE_OAUTH_REFRESH_TOKEN}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN or CLOUDFLARE_OAUTH_REFRESH_TOKEN (see web/CLOUDFLARE.md)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_OAUTH_CLIENT_ID}" ]; then
            echo "::error::Set variable CLOUDFLARE_OAUTH_CLIENT_ID for OAuth refresh."
            exit 1
          fi

          echo "Minting short-lived Cloudflare access token from OAuth refresh…"
          RESP="$(curl -sS -X POST 'https://dash.cloudflare.com/oauth2/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'User-Agent: wrangler-ci/webinar' \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${CLOUDFLARE_OAUTH_REFRESH_TOKEN}" \
            --data-urlencode "client_id=${CLOUDFLARE_OAUTH_CLIENT_ID}")"

          ACCESS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")"
          NEW_REFRESH="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("refresh_token",""))' <<<"$RESP")"
          if [ -z "$ACCESS" ]; then
            echo "::error::OAuth refresh failed. Re-login with wrangler locally and update CLOUDFLARE_OAUTH_REFRESH_TOKEN."
            echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d)' 2>/dev/null || echo "$RESP"
            exit 1
          fi

          # Expose for later steps (masked by Actions if it looks like a secret when set via ENV)
          echo "::add-mask::$ACCESS"
          echo "CLOUDFLARE_API_TOKEN=$ACCESS" >> "$GITHUB_ENV"
          if [ -n "$NEW_REFRESH" ] && [ "$NEW_REFRESH" != "${CLOUDFLARE_OAUTH_REFRESH_TOKEN}" ]; then
            echo "::add-mask::$NEW_REFRESH"
            if [ -n "${GH_SECRETS_PAT}" ]; then
              echo "Persisting rotated Cloudflare OAuth refresh token to repo secrets…"
              printf '%s' "$NEW_REFRESH" | GH_TOKEN="${GH_SECRETS_PAT}" gh secret set CLOUDFLARE_OAUTH_REFRESH_TOKEN -R "${GITHUB_REPOSITORY}"
            else
              echo "::warning::Cloudflare rotated the refresh token and GH_SECRETS_PAT is unset; next CI run may fail until you update CLOUDFLARE_OAUTH_REFRESH_TOKEN."
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.skip != 'true'
        run: npm ci

      - name: Deploy
        if: steps.creds.outputs.skip != 'true'
        run: npm run deploy
