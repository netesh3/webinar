# Deploy the Next.js frontend to Cloudflare Workers (OpenNext).
# Secrets live on the repo (Settings → Secrets and variables → Actions); never commit them.
#
# Triggers:
#   - push to main touching web/** or this workflow file
#   - workflow_dispatch (Actions tab)
#
# Required secret:
#   CLOUDFLARE_API_TOKEN — "Edit Cloudflare Workers" template, scoped to the
#     account in CLOUDFLARE_ACCOUNT_ID and to the webinarliv.com zone (the Worker
#     claims apex + www as custom domains, see web/wrangler.jsonc routes).
#
# Required repository variable:
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id (`npx wrangler whoami` / dashboard)
#
# Auth is intentionally a single stateless path: an API token never rotates, so
# concurrent runs, re-runs of old runs, and local `wrangler` use cannot invalidate
# each other. CI writes nothing back to repo secrets. (A previous version fell back
# to exchanging a wrangler OAuth refresh token; those are single-use, so runs raced
# each other into `invalid_grant` — see web/CLOUDFLARE.md.)
#
# Build env (plain config, not secrets):
#   NEXT_PUBLIC_API_BASE="" — same-origin /api via the Worker proxy (web/CLOUDFLARE.md)
#   OPEN_NEXT=1
#
# The runtime API target stays in web/wrangler.jsonc vars (API_INTERNAL_URL).

name: Deploy Web (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-workers-deploy.yml"

concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE: ""
      OPEN_NEXT: "1"
      # Hide virtual backgrounds / low-light until the MediaPipe effect path is stable
      # on real Chrome (callbacks.shift interrupt after #175/#177). Re-enable: set to "1"
      # (or remove) and redeploy. Local `next dev` leaves the flag unset so the UI stays on.
      NEXT_PUBLIC_VIRTUAL_BACKGROUNDS: "0"

    steps:
      - uses: actions/checkout@v4

      # Catch a missing, revoked, or wrongly-scoped token in seconds rather than
      # after a full Next.js build. Network trouble only warns, so a Cloudflare
      # blip cannot fail the job on its own.
      - name: Verify Cloudflare credentials
        working-directory: .
        run: |
          set -euo pipefail

          TOKEN_HELP="Re-create it at https://dash.cloudflare.com/profile/api-tokens with the 'Edit Cloudflare Workers' template (Account Resources must include ${CLOUDFLARE_ACCOUNT_ID}, Zone Resources must include webinarliv.com), then run: gh secret set CLOUDFLARE_API_TOKEN -R ${GITHUB_REPOSITORY}"

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is unset. Get it from 'npx wrangler whoami' and set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is unset, so this deploy cannot run. ${TOKEN_HELP}"
            exit 1
          fi

          STATUS="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("status") or "invalid")' \
            2>/dev/null || echo unreachable)"

          case "$STATUS" in
            active)
              echo "Token verified (status: active)."
              ;;
            unreachable)
              echo "::warning::Could not reach Cloudflare's token verify endpoint; continuing and letting wrangler validate the token."
              ;;
            *)
              echo "::error::CLOUDFLARE_API_TOKEN is set but Cloudflare reports it as '${STATUS}'. ${TOKEN_HELP}"
              exit 1
              ;;
          esac

          # Confirm the token actually reaches Workers in the target account,
          # which is the exact permission + resource pair `wrangler deploy` needs.
          CODE="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            || echo 000)"

          case "$CODE" in
            200)
              echo "Token can read Workers scripts in account ${CLOUDFLARE_ACCOUNT_ID}."
              ;;
            000)
              echo "::warning::Could not reach the Cloudflare Workers API to check token scope; continuing."
              ;;
            401 | 403)
              echo "::error::CLOUDFLARE_API_TOKEN is active but Cloudflare returned HTTP ${CODE} for Workers in account ${CLOUDFLARE_ACCOUNT_ID}, so it is missing the 'Workers Scripts: Edit' permission or that account is not in its Account Resources. ${TOKEN_HELP}"
              exit 1
              ;;
            404)
              echo "::error::Cloudflare returned HTTP 404 for account ${CLOUDFLARE_ACCOUNT_ID}: either the CLOUDFLARE_ACCOUNT_ID variable is wrong, or the token's Account Resources do not include that account. ${TOKEN_HELP}"
              exit 1
              ;;
            *)
              echo "::warning::Unexpected HTTP ${CODE} while checking token scope; continuing and letting wrangler decide."
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy Worker
        run: |
          set -euo pipefail
          npm run deploy 2>&1 | tee "${RUNNER_TEMP}/deploy.log"

      - name: Report deployed version
        if: always()
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/deploy.log"
          [ -f "$LOG" ] || exit 0

          VERSION="$(grep -oiE 'current version id:[[:space:]]*[0-9a-f-]{8,}' "$LOG" \
            | tail -1 | awk '{print $NF}')"
          URL="$(grep -oE 'https://[a-z0-9.-]*workers\.dev' "$LOG" | tail -1)"

          {
            echo "### Cloudflare Worker deploy"
            echo ""
            echo "- Worker: \`webinar-web\`"
            if [ -n "$VERSION" ]; then
              echo "- Version ID: \`${VERSION}\`"
            else
              echo "- Version ID: not reported by wrangler"
            fi
            [ -n "$URL" ] && echo "- URL: ${URL}"
            echo "- Custom domains: https://webinarliv.com, https://www.webinarliv.com"
          } >> "$GITHUB_STEP_SUMMARY"

          [ -n "$VERSION" ] && echo "Deployed version ID: ${VERSION}"
          exit 0
