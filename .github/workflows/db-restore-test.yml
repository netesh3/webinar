# Restore test (docs/BACKUPS.md): every week, and on demand, restore the newest backup from R2
# into a throwaway Postgres with pgvector and check the key tables came back. A backup that has
# never been restored is a hope, not a backup.
#
# Nothing here touches production: the target is this job's own service container. Secrets are
# the storage ones db-backup.yml uses (RECORDINGS_S3_* or DB_BACKUP_S3_*), never echoed.
name: DB restore test

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays, after the night's backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        # The major should match production's (db-backup.yml logs it). pg_restore below is the
        # same major, and a dump restores into the same or a newer server.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RECORDINGS_S3_BUCKET: ${{ secrets.RECORDINGS_S3_BUCKET }}
      RECORDINGS_S3_ENDPOINT: ${{ secrets.RECORDINGS_S3_ENDPOINT }}
      RECORDINGS_S3_REGION: ${{ secrets.RECORDINGS_S3_REGION }}
      RECORDINGS_S3_ACCESS_KEY: ${{ secrets.RECORDINGS_S3_ACCESS_KEY }}
      RECORDINGS_S3_SECRET_KEY: ${{ secrets.RECORDINGS_S3_SECRET_KEY }}
      DB_BACKUP_S3_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
      DB_BACKUP_S3_ENDPOINT: ${{ secrets.DB_BACKUP_S3_ENDPOINT }}
      DB_BACKUP_S3_REGION: ${{ secrets.DB_BACKUP_S3_REGION }}
      DB_BACKUP_S3_ACCESS_KEY: ${{ secrets.DB_BACKUP_S3_ACCESS_KEY }}
      DB_BACKUP_S3_SECRET_KEY: ${{ secrets.DB_BACKUP_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Fetch the newest backup
        working-directory: api
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dbbackup" ./cmd/dbbackup
          "$RUNNER_TEMP/dbbackup" latest "$RUNNER_TEMP/latest.dump"

      - name: Restore and check
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          target="postgres://postgres:scratch@localhost:5432/restore?sslmode=disable"
          scripts/db-restore.sh "$RUNNER_TEMP/latest.dump" "$target" | tee "$RUNNER_TEMP/counts.txt"
          # A restore with no users or no webinars is a broken backup, not a quiet week.
          for t in users webinars; do
            n=$(psql "$target" -XAtqc "SELECT count(*) FROM public.$t")
            echo "$t: $n"
            [ "$n" -gt 0 ] || { echo "::error::restored $t is empty"; exit 1; }
          done
