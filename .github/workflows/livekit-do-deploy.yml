# Deploy the self-hosted LiveKit stack to the DigitalOcean video server
# (sfu-blr-1, LiveKit project do-blr — see deploy/digitalocean/README.md).
# The files and redeploy.sh in deploy/livekit-box/ (deploy/livekit-hetzner/ until 2026-10-26,
# when the Hetzner server was deleted; this is the only workflow that deploys the stack).
#
# Triggers:
#   - workflow_dispatch — manual deploy from the Actions tab
#   - push to main — when deploy/livekit-box/** or this workflow change. Not deploy/captions/**,
#     so a captions change never restarts the video box on its own: the next droplet syncs it at
#     boot (sfu-boot.sh), and a manual run brings it to a box that is up.
#
# Repository secrets:
#   DO_SSH_HOST         — root@152.42.156.192 (the reserved IP)
#   DO_SSH_PRIVATE_KEY  — a deploy key whose public half is in the box's
#                         /root/.ssh/authorized_keys (not anybody's personal key)
#   GRAFANA_ADMIN_PASSWORD — optional: the box's local Grafana login (user "admin")
#   GRAFANA_CLOUD_TOKEN — optional: Grafana Cloud access policy token for Alloy (metrics + logs)
#   DEEPGRAM_API_KEY, CAPTIONS_SECRET — optional, both: live captions on the box (the Deepgram
#                         caption worker, docker-compose.captions-worker.yml). Written into its
#                         .env as the API writes them into each new droplet's user data.
#
# Repository variables (optional, with GRAFANA_CLOUD_TOKEN; all five or Alloy stays off):
#   GRAFANA_CLOUD_PROM_URL, GRAFANA_CLOUD_PROM_USER, GRAFANA_CLOUD_LOKI_URL, GRAFANA_CLOUD_LOKI_USER
#   (deploy/livekit-box/README.md, "Grafana Cloud")
#
# Until both SSH secrets are set the job SKIPS with a notice rather than failing, so a merge to
# main is not red while the box is being set up. Box settings (MIXREC_*, …)
# live in /opt/livekit/.env on the box and are never overwritten, nor are .env.keys and the
# generated livekit.yaml.
#
# Deploy guard (docs/DEPLOYMENT-TOPOLOGY.md): a redeploy restarts LiveKit, egress,
# MediaMTX and Caddy, cutting off every session on the box. So before anything touches it, the
# job waits while a session is live on project do-blr (.github/scripts/wait-no-live.sh, secret
# TICK_SECRET; project overridable with repo variable DO_LIVEKIT_PROJECT), and FAILS if the API
# cannot say. Run workflow with "force" to skip it.
#
# On-demand box (deploy/digitalocean/README.md): when the API reports the box down (live-status
# "boxes"), the job skips: the next droplet syncs deploy files from main at boot. The SSH host
# key changes with every droplet; ssh-keyscan below reads the current one each run. The deploy
# key must be in /mnt/sfu-data/ssh/authorized_keys on the volume so new droplets accept it.
# A successful run triggers "Video server image (DigitalOcean snapshot)".

name: Deploy LiveKit (DigitalOcean)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if a session is live on this box (skips the deploy guard)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "deploy/livekit-box/**"
      - ".github/workflows/livekit-do-deploy.yml"

concurrency:
  group: deploy-livekit-do
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DigitalOcean SSH secrets
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${DO_SSH_HOST}" ] || [ -z "${DO_SSH_PRIVATE_KEY}" ]; then
            echo "::notice::DO_SSH_HOST / DO_SSH_PRIVATE_KEY not set: skipping the DigitalOcean deploy (see this workflow's header)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      # The box is created on demand (api/internal/api/sfu_box.go). DOWN: there is nothing to
      # deploy to, and the next droplet syncs these files from main at boot
      # (deploy/digitalocean/sfu-boot.sh), so skip. Starting: wait for it to be ready (its boot
      # already took main as it was), then deploy as usual. An API without the field (older
      # build) or no answer: carry on to the deploy guard, which decides as before.
      - name: Is the box up?
        if: env.SKIP != 'true'
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          API_BASE: ${{ vars.LIVE_STATUS_API_BASE || 'https://webcast-api-65278594492.asia-south1.run.app' }}
          PROJECT: ${{ vars.DO_LIVEKIT_PROJECT || 'do-blr' }}
        run: |
          [ -n "${TICK_SECRET}" ] || exit 0
          for i in $(seq 1 30); do
            actual="$(curl -fsS -m 20 -H "X-Tick-Secret: ${TICK_SECRET}" "${API_BASE%/}/api/internal/live-status" 2>/dev/null |
              jq -r --arg p "$PROJECT" '.boxes[$p].actual // "unmanaged"' 2>/dev/null || echo unknown)"
            case "$actual" in
              down|deleting|failed)
                echo "::notice::The ${PROJECT} video server is ${actual}: nothing to deploy. The next droplet syncs deploy files from main when it boots."
                echo "SKIP=true" >> "$GITHUB_ENV"
                exit 0 ;;
              creating|booting)
                echo "The ${PROJECT} video server is ${actual}; waiting for it to be ready ($i/30)"
                sleep 30 ;;
              *)
                echo "Video server ${PROJECT}: ${actual}"
                exit 0 ;;
            esac
          done
          echo "::warning::The ${PROJECT} video server did not become ready in 15 minutes; continuing to the deploy guard."

      # Before the first step that touches the box.
      - name: Deploy guard (wait while a session is live on this box)
        if: env.SKIP != 'true'
        env:
          GUARD_SCOPE: ${{ vars.DO_LIVEKIT_PROJECT || 'do-blr' }}
          GUARD_MODE: strict
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          API_BASE: ${{ vars.LIVE_STATUS_API_BASE }}
          FORCE: ${{ inputs.force == true || vars.DEPLOY_GUARD_SKIP == 'true' || contains(github.event.head_commit.message, '[skip guard]') }}
        run: bash .github/scripts/wait-no-live.sh

      - name: Configure SSH
        if: env.SKIP != 'true'
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/do_deploy"
          chmod 600 "$HOME/.ssh/do_deploy"
          host_only="${DO_SSH_HOST#*@}"
          user_part="${DO_SSH_HOST%%@*}"
          if [ "$user_part" = "$DO_SSH_HOST" ]; then
            user_part=root
          fi
          ssh-keyscan -H "$host_only" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          {
            echo "Host livekit-do"
            echo "  HostName ${host_only}"
            echo "  User ${user_part}"
            echo "  IdentityFile ${HOME}/.ssh/do_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "SSH_CONFIG=$HOME/.ssh/config" >> "$GITHUB_ENV"

      - name: Validate Caddyfile
        if: env.SKIP != 'true'
        run: |
          docker run --rm \
            -v "$PWD/deploy/livekit-box/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=validate.example.com \
            caddy:2-alpine \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # The TURN-over-TLS variant (TURN_TLS_443=true in the box's .env): the layer4 build of
      # Caddy, with the base Caddyfile imported, as docker-compose.turn443.yml runs it.
      - name: Validate Caddyfile.turn443
        if: env.SKIP != 'true'
        run: |
          docker build -q -t caddy-l4:validate deploy/livekit-box/caddy-l4
          docker run --rm \
            -v "$PWD/deploy/livekit-box/Caddyfile.turn443:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/livekit-box/Caddyfile:/etc/caddy/Caddyfile.base:ro" \
            -e DOMAIN=validate.example.com \
            -e TURN_TLS_DOMAIN=turn.validate.example.com \
            caddy-l4:validate \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Sync deploy files (preserve secrets)
        if: env.SKIP != 'true'
        run: |
          rsync -az \
            --exclude '.env.keys' \
            --exclude '.env' \
            --exclude 'livekit.yaml' \
            -e "ssh -F ${SSH_CONFIG}" \
            deploy/livekit-box/ \
            livekit-do:/opt/livekit/
          # The caption worker's source (redeploy.sh builds it only when captions run on the box).
          rsync -az --delete --exclude 'tests' --exclude '__pycache__' \
            -e "ssh -F ${SSH_CONFIG}" \
            deploy/captions/ \
            livekit-do:/opt/livekit/captions-worker/

      # Grafana Cloud for Alloy (docker-compose.alloy.yml). Written into the box's .env, which is
      # on the sfu-data volume, so every later droplet has them at boot without this workflow.
      # Only when all five are set; otherwise .env is left as it is (Alloy stays off, or keeps
      # whatever was set by hand). Values go over stdin, never on a command line.
      - name: Grafana Cloud settings (Alloy)
        if: env.SKIP != 'true'
        env:
          GRAFANA_CLOUD_PROM_URL: ${{ vars.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ vars.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          keys="GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER GRAFANA_CLOUD_TOKEN"
          for k in $keys; do
            if [ -z "${!k}" ]; then
              echo "::notice::${k} not set: leaving the box's Grafana Cloud settings as they are (see deploy/livekit-box/README.md, Grafana Cloud)."
              exit 0
            fi
            case "${!k}" in *$'\n'*) echo "::error::${k} has a newline"; exit 1 ;; esac
          done
          for k in $keys; do printf '%s=%s\n' "$k" "${!k}"; done | ssh -F "${SSH_CONFIG}" livekit-do '
            set -eu
            cd /opt/livekit
            new="$(cat)"
            tmp="$(mktemp)"
            grep -vE "^GRAFANA_CLOUD_(PROM_URL|PROM_USER|LOKI_URL|LOKI_USER|TOKEN)=" .env >"$tmp" || :
            printf "%s\n" "$new" >>"$tmp"
            chmod --reference=.env "$tmp" 2>/dev/null || chmod 600 "$tmp"
            mv "$tmp" .env'
          echo "Grafana Cloud settings written to /opt/livekit/.env"

      # Live captions on the box (the Deepgram worker): the same settings the API gives each new
      # droplet (boxCaptionsEnv), so a box that is up gets them too. CAPTIONS_PROVIDER=local in the
      # repo variables, or either secret missing: CAPTIONS_PROVIDER=off, the worker stops and the
      # key leaves .env. Values go over stdin, never on a command line, and are never printed.
      - name: Caption worker settings (Deepgram)
        if: env.SKIP != 'true'
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CAPTIONS_SECRET: ${{ secrets.CAPTIONS_SECRET }}
          CAPTIONS_PROVIDER: ${{ vars.CAPTIONS_PROVIDER }}
          CAPTIONS_AGENT_NAME: ${{ vars.CAPTIONS_AGENT_NAME }}
          CAPTIONS_DEEPGRAM_MODEL: ${{ vars.CAPTIONS_DEEPGRAM_MODEL }}
          CAPTIONS_DEEPGRAM_LANGUAGE: ${{ vars.CAPTIONS_DEEPGRAM_LANGUAGE }}
        run: |
          plain='^[A-Za-z0-9._:/@+=%?&,~-]+$'
          if [ -n "$DEEPGRAM_API_KEY" ] && [ "${#CAPTIONS_SECRET}" -ge 32 ] && [ "${CAPTIONS_PROVIDER:-deepgram}" = "deepgram" ]; then
            lines="CAPTIONS_PROVIDER=deepgram
          DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
          CAPTIONS_SECRET=${CAPTIONS_SECRET}
          CAPTIONS_API_URL=https://webinarliv.com
          CAPTIONS_AGENT_NAME=${CAPTIONS_AGENT_NAME:-webinar-captions}
          CAPTIONS_DEEPGRAM_MODEL=${CAPTIONS_DEEPGRAM_MODEL:-nova-3}
          CAPTIONS_DEEPGRAM_LANGUAGE=${CAPTIONS_DEEPGRAM_LANGUAGE:-multi}"
            state=on
          else
            lines="CAPTIONS_PROVIDER=off"
            state=off
          fi
          lines="$(printf '%s\n' "$lines" | sed 's/^ *//')"
          while IFS= read -r l; do
            [[ "${l#*=}" =~ $plain ]] || { echo "::error::${l%%=*} has a character the box's .env cannot carry"; exit 1; }
          done <<<"$lines"
          printf '%s\n' "$lines" | ssh -F "${SSH_CONFIG}" livekit-do '
            set -eu
            cd /opt/livekit
            new="$(cat)"
            tmp="$(mktemp)"
            grep -vE "^(CAPTIONS_PROVIDER|DEEPGRAM_API_KEY|CAPTIONS_SECRET|CAPTIONS_API_URL|CAPTIONS_AGENT_NAME|CAPTIONS_DEEPGRAM_MODEL|CAPTIONS_DEEPGRAM_LANGUAGE)=" .env >"$tmp" || :
            printf "%s\n" "$new" >>"$tmp"
            chmod 600 "$tmp"
            mv "$tmp" .env'
          echo "Caption worker: ${state} in /opt/livekit/.env"

      - name: Egress image settings (zero-latency x264)
        if: env.SKIP != 'true'
        env:
          EGRESS_IMAGE: ${{ vars.EGRESS_IMAGE }}
          EGRESS_X264_ZEROLATENCY: ${{ vars.EGRESS_X264_ZEROLATENCY }}
        run: |
          # The patched image (deploy/egress-patch) only when the repo variable names it;
          # both lines removed when unset, so the box goes back to stock Egress.
          plain='^[A-Za-z0-9._:/@+-]+$'
          lines=""
          if [ -n "$EGRESS_IMAGE" ]; then
            [[ "$EGRESS_IMAGE" =~ $plain ]] || { echo "::error::EGRESS_IMAGE has a character the box's .env cannot carry"; exit 1; }
            lines="EGRESS_IMAGE=${EGRESS_IMAGE}
          EGRESS_X264_ZEROLATENCY=${EGRESS_X264_ZEROLATENCY:-false}"
          fi
          lines="$(printf '%s\n' "$lines" | sed 's/^ *//')"
          printf '%s\n' "$lines" | ssh -F "${SSH_CONFIG}" livekit-do '
            set -eu
            cd /opt/livekit
            new="$(cat)"
            tmp="$(mktemp)"
            grep -vE "^(EGRESS_IMAGE|EGRESS_X264_ZEROLATENCY)=" .env >"$tmp" || :
            [ -n "$new" ] && printf "%s\n" "$new" >>"$tmp"
            chmod 600 "$tmp"
            mv "$tmp" .env'
          echo "Egress: ${EGRESS_IMAGE:-stock livekit/egress} (zero-latency ${EGRESS_X264_ZEROLATENCY:-false})"

      - name: Regenerate config and restart compose
        if: env.SKIP != 'true'
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          printf '%s' "${GRAFANA_ADMIN_PASSWORD}" | ssh -F "${SSH_CONFIG}" livekit-do \
            'chmod +x /opt/livekit/redeploy.sh /opt/livekit/install.sh && GRAFANA_ADMIN_PASSWORD="$(cat)" /opt/livekit/redeploy.sh'

      - name: Health check
        if: env.SKIP != 'true'
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
        run: |
          host_only="${DO_SSH_HOST#*@}"
          for i in $(seq 1 20); do
            if curl -fsS -m 5 "https://${host_only}.sslip.io/" >/dev/null; then
              echo "LiveKit answers at https://${host_only}.sslip.io"
              exit 0
            fi
            sleep 6
          done
          echo "LiveKit did not answer after redeploy" >&2
          exit 1
