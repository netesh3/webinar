# Deploy the inbound mail worker (deploy/cloudflare/email-inbound) to Cloudflare Workers.
# Worker name webinar-email-inbound: the Email Routing catch-all for *@webinarliv.com. It POSTs
# each message to the API's /api/webhooks/email and holds replies in the INBOX KV namespace
# (ID in wrangler.toml) when the API cannot take them. No routes, no custom domain, no cron.
#
# Secrets (repo): CLOUDFLARE_API_TOKEN, INBOX_WEBHOOK_SECRET (the same value Deploy API ships to
# Cloud Run). Variable: CLOUDFLARE_ACCOUNT_ID. INBOX_WEBHOOK_SECRET is piped into
# `wrangler secret put` and never printed.
#
# Email Routing itself (the catch-all rule pointing at this worker) is dashboard configuration,
# not deployed from here. See docs/runbooks/cloudflare-account-move.md.
#
# No deploy guard: this worker does not touch live sessions.

name: Deploy Email Inbound Worker (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare/email-inbound/**"
      - ".github/workflows/email-inbound-deploy.yml"

concurrency:
  group: deploy-email-inbound-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare/email-inbound
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check secrets are present
        env:
          INBOX_WEBHOOK_SECRET: ${{ secrets.INBOX_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is unset."; exit 1; }
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is unset."; exit 1; }
          [ -n "${INBOX_WEBHOOK_SECRET}" ] || { echo "::error::Secret INBOX_WEBHOOK_SECRET is unset."; exit 1; }

      # Same check as Deploy Web: catch a revoked or wrongly-scoped token before wrangler does.
      # Accepts a user token (/user/tokens/verify) or an account-owned token
      # (/accounts/<id>/tokens/verify). Network trouble only warns.
      - name: Verify Cloudflare credentials
        run: |
          set -euo pipefail
          TOKEN_HELP="Create it from the 'Edit Cloudflare Workers' template (Account Resources must include ${CLOUDFLARE_ACCOUNT_ID}), then run: gh secret set CLOUDFLARE_API_TOKEN -R ${GITHUB_REPOSITORY}"

          verify() {
            curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$1" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("status") or "invalid")' \
              2>/dev/null || echo unreachable
          }
          STATUS="$(verify 'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          if [ "$STATUS" != "active" ] && [ "$STATUS" != "unreachable" ]; then
            STATUS="$(verify "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"
          fi
          case "$STATUS" in
            active) echo "Token verified (status: active)." ;;
            unreachable) echo "::warning::Could not reach Cloudflare's token verify endpoint; continuing and letting wrangler validate the token." ;;
            *) echo "::error::CLOUDFLARE_API_TOKEN is set but Cloudflare reports it as '${STATUS}'. ${TOKEN_HELP}"; exit 1 ;;
          esac

          CODE="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            || echo 000)"
          case "$CODE" in
            200) echo "Token can read Workers scripts in account ${CLOUDFLARE_ACCOUNT_ID}." ;;
            000) echo "::warning::Could not reach the Cloudflare Workers API to check token scope; continuing." ;;
            401 | 403) echo "::error::HTTP ${CODE} for Workers in account ${CLOUDFLARE_ACCOUNT_ID}: the token lacks 'Workers Scripts: Edit' or that account is not in its Account Resources. ${TOKEN_HELP}"; exit 1 ;;
            404) echo "::error::HTTP 404 for account ${CLOUDFLARE_ACCOUNT_ID}: the CLOUDFLARE_ACCOUNT_ID variable is wrong or the token cannot see that account. ${TOKEN_HELP}"; exit 1 ;;
            *) echo "::warning::Unexpected HTTP ${CODE} while checking token scope; continuing and letting wrangler decide." ;;
          esac

      # Deploy first so the worker exists, then set the secret (which publishes a new version).
      # Until the secret lands the worker skips the API POST and only keeps the message in KV.
      - name: Deploy worker
        run: npx --yes wrangler@4 deploy

      - name: Set INBOX_WEBHOOK_SECRET
        env:
          INBOX_WEBHOOK_SECRET: ${{ secrets.INBOX_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # printf, not echo: no trailing newline in the stored secret.
          printf '%s' "$INBOX_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put INBOX_WEBHOOK_SECRET
