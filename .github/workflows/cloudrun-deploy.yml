# Deploy the Go API to Google Cloud Run.
# Secrets must be set on the repo (Settings → Secrets → Actions); never commit them.
#
# Path filters (push to main):
#   - api/**                      — Go service + Dockerfile under api/
#   - deploy/cloudrun-deploy.sh   — deploy script
#   - deploy/cloudrun.env.example — documented env shape
#   - .github/workflows/cloudrun-deploy.yml
#
# Also: workflow_dispatch (manual) from the Actions tab.
#
# Required repository secrets:
#   GCP_SA_KEY           — JSON key for a deploy SA (Artifact Registry + Cloud Run + Cloud Build)
#   DATABASE_URL         — prefer Supabase direct URI with sslmode=require (deploy/SUPABASE.md)
#   SESSION_SECRET
#   LIVEKIT_URL          — e.g. wss://YOUR_PROJECT.livekit.cloud
#   LIVEKIT_API_KEY
#   LIVEKIT_API_SECRET
#     — or set LIVEKIT_PROJECTS (JSON) instead of the legacy trio
#
# Optional:
#   CORS_ORIGINS (comma-separated origins OK; script uses --env-vars-file),
#   WEB_BASE_URL, LIVEKIT_HTTP_URL, LIVEKIT_PROJECTS
#   ADMIN_EMAILS / ADMIN_PASSWORD — bootstrap production admin on fresh DB (≥10 chars)
#   SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_JWT_SECRET — Google sign-in via Supabase Auth
#   GOOGLE_CLIENT_ID — Web OAuth client (selfreminder-rnix); exposed as googleClientId for One Tap
#   GOOGLE_API_KEY — optional; Drive Picker only
#   TELEMETRY_ENABLED — hardcoded below (not a secret): "true" turns on
#     POST /telemetry for a performance-test window. Flip to "false" and
#     redeploy when the test is done.
#   CLOUD_SQL_INSTANCE — only if not using Supabase
#   GCP_PROJECT / GCP_REGION as repo Variables (defaults in deploy/cloudrun-deploy.sh)
#   RECORDINGS_ENABLED — unset/false by default; set "true" to turn recording on
#   RECORDINGS_BACKEND — "disk" or "s3" (api/internal/media). Required with
#     RECORDINGS_ENABLED=true; "s3" also needs the five RECORDINGS_S3_* below.
#   RECORDINGS_S3_BUCKET / RECORDINGS_S3_ENDPOINT / RECORDINGS_S3_REGION /
#     RECORDINGS_S3_ACCESS_KEY / RECORDINGS_S3_SECRET_KEY — an S3-compatible
#     origin (Cloudflare R2 preferred; B2 still works). R2 endpoint is
#     https://<ACCOUNT_ID>.r2.cloudflarestorage.com, region auto.
#   RECORDINGS_CDN_BASE_URL — public host for playback (default
#     https://recordings.webinarliv.com). Must be a Cloudflare custom domain
#     on the bucket so the audience never talks to the origin.
#   BROADCAST_RTMP_BASE / BROADCAST_HLS_BASE — live attendee origin (MediaMTX).
#     Unset by default: attendees stay on the B2 playlist. Both or neither.
#     BROADCAST_HLS_BASE must be a Cloudflare-proxied host (live.webinarliv.com),
#     never the SFU's sslip.io address — see deploy/livekit-hetzner/README.md.
#   RECORDINGS_RETENTION_DAYS — days to keep cloud recordings (default 30; 0 = keep until deleted).
#
# Repository variables (vars.*, not secrets):
#   EMPTY_ROOM_CLOSE_MIN — minutes an empty live room may run past its scheduled
#     start before the server ends it (default 10; 0 = never).

name: Deploy API (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api/Dockerfile"
      - "deploy/cloudrun-deploy.sh"
      - "deploy/cloudrun.env.example"
      - ".github/workflows/cloudrun-deploy.yml"

concurrency:
  group: deploy-api-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      # Defaults live in deploy/cloudrun-deploy.sh; override via repo variables/secrets if needed.
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_PROJECTS: ${{ secrets.LIVEKIT_PROJECTS }}
      LIVEKIT_HTTP_URL: ${{ secrets.LIVEKIT_HTTP_URL }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      CLOUD_SQL_INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCE }}
      # Was hardcoded "false" — now off unless RECORDINGS_ENABLED is set as a
      # repository secret, so turning recording on is a secret you set, not a
      # line you edit here. deploy/cloudrun-deploy.sh still falls back to
      # "false" if it is unset, same safe default as before.
      RECORDINGS_ENABLED: ${{ secrets.RECORDINGS_ENABLED || 'true' }}
      RECORDINGS_DIR: "/tmp/recordings"
      RECORDINGS_BACKEND: ${{ secrets.RECORDINGS_BACKEND || 's3' }}
      RECORDINGS_S3_BUCKET: ${{ secrets.RECORDINGS_S3_BUCKET }}
      RECORDINGS_S3_ENDPOINT: ${{ secrets.RECORDINGS_S3_ENDPOINT }}
      RECORDINGS_S3_REGION: ${{ secrets.RECORDINGS_S3_REGION }}
      RECORDINGS_S3_ACCESS_KEY: ${{ secrets.RECORDINGS_S3_ACCESS_KEY }}
      RECORDINGS_S3_SECRET_KEY: ${{ secrets.RECORDINGS_S3_SECRET_KEY }}
      RECORDINGS_MODE: ${{ secrets.RECORDINGS_MODE || 'egress' }}
      RECORDINGS_EGRESS_TEMPLATE_URL: ${{ secrets.RECORDINGS_EGRESS_TEMPLATE_URL || 'https://webinarliv.com/recorder-template' }}
      RECORDINGS_EGRESS_PRESET: ${{ secrets.RECORDINGS_EGRESS_PRESET || '1080p' }}
      RECORDINGS_CDN_BASE_URL: ${{ secrets.RECORDINGS_CDN_BASE_URL || 'https://recordings.webinarliv.com' }}
      # No defaults on purpose. Setting these switches every CDN attendee off the
      # B2 playlist and onto the live origin, and the only origin available before
      # DNS exists is the SFU's own sslip.io host — which is a bare Hetzner IP with
      # no Cloudflare in front, so the box would serve one copy of the stream per
      # viewer off a 1 Gbps NIC. Fewer seconds of lag, far fewer seats. Set both
      # secrets once live.webinarliv.com is orange-clouded; see the Hetzner README.
      BROADCAST_RTMP_BASE: ${{ secrets.BROADCAST_RTMP_BASE }}
      BROADCAST_HLS_BASE: ${{ secrets.BROADCAST_HLS_BASE }}
      RECORDINGS_RETENTION_DAYS: ${{ secrets.RECORDINGS_RETENTION_DAYS || '30' }}
      EMPTY_ROOM_CLOSE_MIN: ${{ vars.EMPTY_ROOM_CLOSE_MIN || '10' }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SEED_DEV: "false"
      # Temporary, for a performance-test window: POST /telemetry (see
      # api/internal/api/telemetry.go). Flip back to "false" and redeploy when
      # the test is done — no code change needed either direction.
      TELEMETRY_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Require DATABASE_URL (Supabase)
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Set repository secret DATABASE_URL to a Supabase URI with sslmode=require (see deploy/SUPABASE.md)." >&2
            exit 1
          fi
          if [ -z "${SESSION_SECRET}" ]; then
            echo "Set repository secret SESSION_SECRET." >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: chmod +x deploy/cloudrun-deploy.sh && ./deploy/cloudrun-deploy.sh
