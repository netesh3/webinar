# Deploy the Go API to Google Cloud Run.
# Secrets must be set on the repo (Settings → Secrets → Actions); never commit them.
#
# Path filters (push to main):
#   - api/**                      — Go service + Dockerfile under api/
#   - deploy/cloudrun-deploy.sh   — deploy script
#   - deploy/cloudrun.env.example — documented env shape
#   - .github/workflows/cloudrun-deploy.yml
#
# Also: workflow_dispatch (manual) from the Actions tab.
#
# Required repository secrets:
#   GCP_SA_KEY           — JSON key for a deploy SA (Artifact Registry + Cloud Run + Cloud Build)
#   DATABASE_URL         — Supabase TRANSACTION pooler :6543 with sslmode=require (recommended),
#                          or the session pooler :5432 (works, but see the budget in
#                          deploy/SUPABASE.md "Connection budget")
#   DATABASE_LISTEN_URL  — optional: session-mode URL (:5432) for LISTEN + migrations; derived
#                          from a Supabase :6543 DATABASE_URL when unset
#   SESSION_SECRET
#   LIVEKIT_URL          — e.g. wss://YOUR_PROJECT.livekit.cloud
#   LIVEKIT_API_KEY
#   LIVEKIT_API_SECRET
#     — or set LIVEKIT_PROJECTS (JSON) instead of the legacy trio
#
# Optional:
#   CORS_ORIGINS (comma-separated origins OK; script uses --env-vars-file),
#   WEB_BASE_URL, LIVEKIT_HTTP_URL, LIVEKIT_PROJECTS
#   ADMIN_EMAILS / ADMIN_PASSWORD — bootstrap production admin on fresh DB (≥10 chars)
#   SUPABASE_URL / SUPABASE_PROJECT_URL / SUPABASE_ANON_KEY / SUPABASE_JWT_SECRET — Google sign-in via Supabase Auth
#   GOOGLE_CLIENT_ID — Web OAuth client (selfreminder-rnix); exposed as googleClientId for One Tap
#   GOOGLE_API_KEY — optional; Drive Picker only
#   GOOGLE_CLIENT_SECRET — same Web client secret; Connect YouTube / YouTube Data API
#   META_APP_ID / META_APP_SECRET / META_WHATSAPP_CONFIG_ID — Connect WhatsApp via Meta
#     Embedded Signup. All three or none: the API refuses to boot on a partial set.
#   TICK_SECRET — optional, >= 32 chars. Turns on POST /api/internal/tick, which
#     Cloud Scheduler calls every minute so reminders send while scaled to zero.
#   CAPTIONS_SECRET — optional, >= 32 chars. Turns on server-side live captions: the
#     caption agent (deploy/captions) posts lines with it. Same value on the agent's side.
#   MIXREC_SECRET — optional, >= 32 chars. Edge cloud recordings record the running mix
#     through the SFU box's mix recorder (deploy/livekit-box/mixrec). Same value in the
#     box's /opt/livekit/.env.
#   DO_API_TOKEN — optional, with repo variable SFU_BOX_PROJECT (e.g. do-blr): the API creates
#     and deletes the DigitalOcean video server on demand (deploy/digitalocean/README.md).
#     Variables SFU_BOX_ALWAYS_ON (true = keep it up, the rollback), SFU_BOX_WARM_LEAD,
#     SFU_BOX_IDLE_GRACE, SFU_BOX_SSH_KEYS, SFU_BOX_PARK_DROPLET override the defaults.
#     SFU_BOX_SLOTS (JSON), SFU_BOX_AREA, SFU_BOX_CAPACITY and SFU_BOX_POINTS make it a pool of
#     several boxes (deploy/digitalocean/README.md "More video servers"); unset is one box.
#     CAPTIONS_BOX_ENABLED=true (needs CAPTIONS_SECRET) adds a small captions droplet made and
#     deleted with it; CAPTIONS_BOX_SIZE (s-4vcpu-8gb), _IMAGE, _CPUS, _MAX_ROOMS, _MODEL tune it.
#     Variable CAPTIONS_PROVIDER=deepgram with secret DEEPGRAM_API_KEY makes Deepgram transcribe
#     live (CAPTIONS_FALLBACK_LOCAL, _DEEPGRAM_MODEL nova-3, _DEEPGRAM_LANGUAGE multi tune it).
#   GRAFANA_CLOUD_TOKEN — optional, with repo variables GRAFANA_CLOUD_PROM_URL, _PROM_USER,
#     _LOKI_URL, _LOKI_USER (all five or the API refuses to boot): the box manager passes them in
#     each droplet's user data so the box's Alloy reports to Grafana Cloud from first boot.
#   VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT — optional; Web Push (install the app,
#     "notify me when it starts"). All three or none: the API refuses a partial set. Generate the
#     pair with `npx web-push generate-vapid-keys`; the subject is mailto:you@domain.
#   META_WEBHOOK_VERIFY_TOKEN — must match the Verify token on the Meta app's
#     WhatsApp webhook, whose callback is {API}/api/webhooks/whatsapp
#   ZOOM_CLIENT_ID / ZOOM_CLIENT_SECRET / ZOOM_REDIRECT_URL / ZOOM_TOKEN_KEY —
#     Connect Zoom. All four or the card stays "Zoom is not configured".
#     ZOOM_WEBHOOK_SECRET signs POST /api/webhooks/zoom; unset, that route
#     refuses the body. See docs/zoom-app-checklist.md.
#   OPENAI_API_KEY, CLOUDFLARE_AI_ACCOUNT_ID / CLOUDFLARE_AI_TOKEN, GROQ_API_KEY, OPENROUTER_API_KEY
#     — the AI features (sales chat, "Write with AI"), tried in that order (or AI_PROVIDERS, one
#     JSON list). OpenAI (gpt-5-nano by default) is the paid one; the rest are free-tier
#     fallbacks. All optional; without any the chat hands every visitor to a person.
#     *_MODEL (OPENAI_MODEL, …) as repo Variables. AI_MONTHLY_USD (default 20) and
#     AI_HOST_MONTHLY_USD (default 2), repo Variables, cap the estimated monthly spend.
#     AI_MODEL_HIGHLIGHTS, optional repo Variable: the OpenAI model the clip features use
#     (highlights, reels, hook titles, post text); gpt-5-mini when unset.
#     AI_PROVIDER, optional repo Variable: groq or openai, which is tried first. Unset means
#     groq when GROQ_API_KEY is set (2026-10-27): Groq answers, OpenAI is the fallback on a
#     Groq 429/5xx, and OpenAI still does the embeddings (OPENAI_API_KEY stays required for
#     the AI knowledge). AI_GROQ_MODEL_QUALITY / AI_GROQ_MODEL_FAST / AI_GROQ_MAX_REQUEST_TOKENS
#     (default 7000; raise on Groq's Developer tier), optional Variables: the
#     Groq model per kind of task (openai/gpt-oss-120b / openai/gpt-oss-20b when unset).
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET — self-serve plans (Buy on /pricing).
#     Both or neither. RAZORPAY_WEBHOOK_SECRET signs POST /api/webhooks/razorpay.
#     BILLING_GST_PERCENT (repo Variable, default 18) is added to INR prices.
#   TRIAL_HASH_SALT — turns on the 7-day free trial (with the Razorpay keys). Salts
#     the hashes that keep it once per person. Generate once (openssl rand -hex 32)
#     and never change it: earlier trials would stop matching. Unset: no trials.
#   TELEMETRY_ENABLED — hardcoded below (not a secret): "true" turns on
#     POST /telemetry for a performance-test window. Flip to "false" and
#     redeploy when the test is done.
#   OTEL_EXPORTER_OTLP_HEADERS — optional; "Authorization=Basic <base64 instance:token>" for
#     Grafana Cloud's OTLP gateway. Used only with the repo variable OTEL_EXPORTER_OTLP_ENDPOINT;
#     without that variable telemetry is off. See deploy/cloudrun.env.example.
#   CLOUD_SQL_INSTANCE — only if not using Supabase
#   GCP_PROJECT / GCP_REGION as repo Variables (defaults in deploy/cloudrun-deploy.sh)
#   RECORDINGS_ENABLED — unset/false by default; set "true" to turn recording on
#   RECORDINGS_BACKEND — "disk" or "s3" (api/internal/media). Required with
#     RECORDINGS_ENABLED=true; "s3" also needs the five RECORDINGS_S3_* below.
#   RECORDINGS_S3_BUCKET / RECORDINGS_S3_ENDPOINT / RECORDINGS_S3_REGION /
#     RECORDINGS_S3_ACCESS_KEY / RECORDINGS_S3_SECRET_KEY — an S3-compatible
#     origin (Cloudflare R2 preferred; B2 still works). R2 endpoint is
#     https://<ACCOUNT_ID>.r2.cloudflarestorage.com, region auto.
#   RECORDINGS_CDN_BASE_URL — public host for playback (default
#     https://recordings.webinarliv.com). Must be a Cloudflare custom domain
#     on the bucket so the audience never talks to the origin.
#   BROADCAST_RTMP_BASE / BROADCAST_HLS_BASE — the live origin (MediaMTX on the box) for edge
#     viewers. Both or neither. BROADCAST_HLS_BASE is the fallback for a LiveKit project
#     without its own broadcastHlsBase: the box's own address, e.g.
#     https://<box reserved IP>.sslip.io/live (live.webinarliv.com was the Hetzner origin,
#     deleted 2026-10-26). See deploy/livekit-box/README.md.
#   RECORDINGS_RETENTION_DAYS — days to keep cloud recordings (default 30; 0 = keep until deleted).
#
# Repository variables (vars.*, not secrets):
#   DATABASE_POOL_MODE / DB_MAX_CONNS / DB_CONNECT_TIMEOUT / DB_POOLER_POOL_SIZE — database pool
#     knobs (api/internal/store/dbconfig.go). DATABASE_POOL_MODE=transaction with a Supabase
#     :5432 DATABASE_URL moves queries to :6543 without touching the secret.
#   EDGE_PLAYBACK_BASE / EDGE_NEAR_COUNTRIES / EDGE_DEBUG_CLOCK /
#     EDGE_ENCODING_WIDTH / EDGE_ENCODING_HEIGHT / EDGE_ENCODING_FPS /
#     EDGE_VIDEO_BITRATE_KBPS / EDGE_AUDIO_BITRATE_KBPS / EDGE_H264_PROFILE — Edge delivery playback and
#     egress encoding; each unset keeps its default. See docs/edge-delivery.md.
#   DEBUG_GOROUTINES — "true" turns on GET /api/admin/debug/goroutines (admins only), the
#     answering instance's goroutine profile. Off when unset.
#   OTEL_EXPORTER_OTLP_ENDPOINT — Grafana Cloud OTLP gateway, e.g.
#     https://otlp-gateway-prod-ap-south-1.grafana.net/otlp. Unset = telemetry off.
#     OTEL_TRACES_SAMPLER / OTEL_TRACES_SAMPLER_ARG / OTEL_RESOURCE_ATTRIBUTES / OTEL_SERVICE_NAME
#     override the defaults in deploy/cloudrun-deploy.sh.
#   EMPTY_ROOM_CLOSE_MIN — minutes an empty live room may run past its scheduled
#     start before the server ends it (default 10; 0 = never).
#
# Deploy guard (docs/DEPLOYMENT-TOPOLOGY.md): the first step waits while ANY session is live
# (.github/scripts/wait-no-live.sh, GUARD_MODE=api: proceeds if the API is down or predates the
# endpoint, since this deploy is the fix). Run workflow with "force" to skip it.

name: Deploy API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if a webinar or meeting is live (skips the deploy guard)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api/Dockerfile"
      - "deploy/cloudrun-deploy.sh"
      - "deploy/cloudrun.env.example"
      - ".github/workflows/cloudrun-deploy.yml"

concurrency:
  group: deploy-api-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      # Defaults live in deploy/cloudrun-deploy.sh; override via repo variables/secrets if needed.
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Optional session-mode URL for LISTEN + migrations when DATABASE_URL is the
      # transaction pooler (:6543). Unset: derived for a Supabase pooler host.
      DATABASE_LISTEN_URL: ${{ secrets.DATABASE_LISTEN_URL }}
      DATABASE_POOL_MODE: ${{ vars.DATABASE_POOL_MODE }}
      DB_MAX_CONNS: ${{ vars.DB_MAX_CONNS }}
      DB_CONNECT_TIMEOUT: ${{ vars.DB_CONNECT_TIMEOUT }}
      DB_POOLER_POOL_SIZE: ${{ vars.DB_POOLER_POOL_SIZE }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_PROJECTS: ${{ secrets.LIVEKIT_PROJECTS }}
      LIVEKIT_HTTP_URL: ${{ secrets.LIVEKIT_HTTP_URL }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_WHATSAPP_CONFIG_ID: ${{ secrets.META_WHATSAPP_CONFIG_ID }}
      META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
      # Enables POST /api/internal/tick for Cloud Scheduler (deploy/cloud-scheduler-tick.sh).
      TICK_SECRET: ${{ secrets.TICK_SECRET }}
      # Server-side live captions (deploy/captions). Optional; unset keeps on-device captions.
      CAPTIONS_SECRET: ${{ secrets.CAPTIONS_SECRET }}
      # Cloud recording from the edge mix (deploy/livekit-box/mixrec). Optional.
      MIXREC_SECRET: ${{ secrets.MIXREC_SECRET }}
      # The on-demand DigitalOcean video server (deploy/digitalocean/README.md). SFU_BOX_PROJECT
      # turns it on (and needs the token); the token alone leaves the box unmanaged.
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
      SFU_BOX_PROJECT: ${{ vars.SFU_BOX_PROJECT }}
      SFU_BOX_ALWAYS_ON: ${{ vars.SFU_BOX_ALWAYS_ON }}
      SFU_BOX_WARM_LEAD: ${{ vars.SFU_BOX_WARM_LEAD }}
      SFU_BOX_IDLE_GRACE: ${{ vars.SFU_BOX_IDLE_GRACE }}
      SFU_BOX_SSH_KEYS: ${{ vars.SFU_BOX_SSH_KEYS }}
      SFU_BOX_PARK_DROPLET: ${{ vars.SFU_BOX_PARK_DROPLET }}
      # The pool (api/internal/api/sfu_pool.go): more boxes, declared ahead (deploy/digitalocean/
      # README.md "More video servers"). Unset is the one box, as before.
      SFU_BOX_AREA: ${{ vars.SFU_BOX_AREA }}
      SFU_BOX_CAPACITY: ${{ vars.SFU_BOX_CAPACITY }}
      SFU_BOX_SLOTS: ${{ vars.SFU_BOX_SLOTS }}
      SFU_BOX_POINTS: ${{ vars.SFU_BOX_POINTS }}
      # The captions box beside it (api/internal/api/captions_box.go): off until CAPTIONS_BOX_ENABLED=true.
      CAPTIONS_BOX_ENABLED: ${{ vars.CAPTIONS_BOX_ENABLED }}
      CAPTIONS_BOX_SIZE: ${{ vars.CAPTIONS_BOX_SIZE }}
      CAPTIONS_BOX_IMAGE: ${{ vars.CAPTIONS_BOX_IMAGE }}
      CAPTIONS_BOX_CPUS: ${{ vars.CAPTIONS_BOX_CPUS }}
      CAPTIONS_BOX_MAX_ROOMS: ${{ vars.CAPTIONS_BOX_MAX_ROOMS }}
      CAPTIONS_BOX_MODEL: ${{ vars.CAPTIONS_BOX_MODEL }}
      # Live captions by Deepgram's streaming API instead of the box's own model (provider.py):
      # CAPTIONS_PROVIDER=deepgram plus the DEEPGRAM_API_KEY secret. Unset is local.
      CAPTIONS_PROVIDER: ${{ vars.CAPTIONS_PROVIDER }}
      CAPTIONS_FALLBACK_LOCAL: ${{ vars.CAPTIONS_FALLBACK_LOCAL }}
      CAPTIONS_DEEPGRAM_MODEL: ${{ vars.CAPTIONS_DEEPGRAM_MODEL }}
      CAPTIONS_DEEPGRAM_LANGUAGE: ${{ vars.CAPTIONS_DEEPGRAM_LANGUAGE }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      # Grafana Cloud for the box's Alloy, written into each new droplet's user data so it reports
      # from boot (the same repo variables and secret livekit-do-deploy.yml uses). All five or none.
      GRAFANA_CLOUD_PROM_URL: ${{ vars.GRAFANA_CLOUD_PROM_URL }}
      GRAFANA_CLOUD_PROM_USER: ${{ vars.GRAFANA_CLOUD_PROM_USER }}
      GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
      GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
      GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
      # Web Push (api/internal/push). Optional; unset, the app offers no notifications.
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      CLOUD_SQL_INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCE }}
      # Was hardcoded "false" — now off unless RECORDINGS_ENABLED is set as a
      # repository secret, so turning recording on is a secret you set, not a
      # line you edit here. deploy/cloudrun-deploy.sh still falls back to
      # "false" if it is unset, same safe default as before.
      RECORDINGS_ENABLED: ${{ secrets.RECORDINGS_ENABLED || 'true' }}
      RECORDINGS_DIR: "/tmp/recordings"
      RECORDINGS_BACKEND: ${{ secrets.RECORDINGS_BACKEND || 's3' }}
      RECORDINGS_S3_BUCKET: ${{ secrets.RECORDINGS_S3_BUCKET }}
      RECORDINGS_S3_ENDPOINT: ${{ secrets.RECORDINGS_S3_ENDPOINT }}
      RECORDINGS_S3_REGION: ${{ secrets.RECORDINGS_S3_REGION }}
      RECORDINGS_S3_ACCESS_KEY: ${{ secrets.RECORDINGS_S3_ACCESS_KEY }}
      RECORDINGS_S3_SECRET_KEY: ${{ secrets.RECORDINGS_S3_SECRET_KEY }}
      RECORDINGS_MODE: ${{ secrets.RECORDINGS_MODE || 'egress' }}
      RECORDINGS_EGRESS_TEMPLATE_URL: ${{ secrets.RECORDINGS_EGRESS_TEMPLATE_URL || 'https://webinarliv.com/recorder-template' }}
      RECORDINGS_EGRESS_PRESET: ${{ secrets.RECORDINGS_EGRESS_PRESET || '1080p' }}
      RECORDINGS_CDN_BASE_URL: ${{ secrets.RECORDINGS_CDN_BASE_URL || 'https://recordings.webinarliv.com' }}
      # No defaults; both or neither. The live origin fallback for a project without its own
      # broadcastHlsBase (docs/edge-delivery.md). See deploy/livekit-box/README.md.
      BROADCAST_RTMP_BASE: ${{ secrets.BROADCAST_RTMP_BASE }}
      BROADCAST_HLS_BASE: ${{ secrets.BROADCAST_HLS_BASE }}
      RECORDINGS_RETENTION_DAYS: ${{ secrets.RECORDINGS_RETENTION_DAYS || '30' }}
      EMPTY_ROOM_CLOSE_MIN: ${{ vars.EMPTY_ROOM_CLOSE_MIN || '10' }}
      # Edge delivery (docs/edge-delivery.md). Unset keeps the API's defaults.
      EDGE_PLAYBACK_BASE: ${{ vars.EDGE_PLAYBACK_BASE }}
      OPS_ALERT_EMAILS: ${{ vars.OPS_ALERT_EMAILS }}
      EDGE_NEAR_COUNTRIES: ${{ vars.EDGE_NEAR_COUNTRIES }}
      EDGE_DEBUG_CLOCK: ${{ vars.EDGE_DEBUG_CLOCK }}
      DEBUG_GOROUTINES: ${{ vars.DEBUG_GOROUTINES }}
      EDGE_ENCODING_WIDTH: ${{ vars.EDGE_ENCODING_WIDTH }}
      EDGE_ENCODING_HEIGHT: ${{ vars.EDGE_ENCODING_HEIGHT }}
      EDGE_ENCODING_FPS: ${{ vars.EDGE_ENCODING_FPS }}
      EDGE_VIDEO_BITRATE_KBPS: ${{ vars.EDGE_VIDEO_BITRATE_KBPS }}
      EDGE_AUDIO_BITRATE_KBPS: ${{ vars.EDGE_AUDIO_BITRATE_KBPS }}
      EDGE_H264_PROFILE: ${{ vars.EDGE_H264_PROFILE }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      INBOX_WEBHOOK_SECRET: ${{ secrets.INBOX_WEBHOOK_SECRET }}
      AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      AI_MODEL_HIGHLIGHTS: ${{ vars.AI_MODEL_HIGHLIGHTS }}
      AI_MONTHLY_USD: ${{ vars.AI_MONTHLY_USD }}
      AI_HOST_MONTHLY_USD: ${{ vars.AI_HOST_MONTHLY_USD }}
      CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_GROQ_MODEL_QUALITY: ${{ vars.AI_GROQ_MODEL_QUALITY }}
      AI_GROQ_MODEL_FAST: ${{ vars.AI_GROQ_MODEL_FAST }}
      AI_GROQ_MAX_REQUEST_TOKENS: ${{ vars.AI_GROQ_MAX_REQUEST_TOKENS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      TRIAL_HASH_SALT: ${{ secrets.TRIAL_HASH_SALT }}
      BILLING_GST_PERCENT: ${{ vars.BILLING_GST_PERCENT }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_REDIRECT_URL: ${{ secrets.ZOOM_REDIRECT_URL }}
      ZOOM_TOKEN_KEY: ${{ secrets.ZOOM_TOKEN_KEY }}
      ZOOM_WEBHOOK_SECRET: ${{ secrets.ZOOM_WEBHOOK_SECRET }}
      WELCOME_EMAIL: ${{ vars.WELCOME_EMAIL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      CONTACT_PHONE: ${{ vars.CONTACT_PHONE }}
      # OpenTelemetry to Grafana Cloud (api/internal/observe). Off until the endpoint variable is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
      OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
      OTEL_TRACES_SAMPLER: ${{ vars.OTEL_TRACES_SAMPLER }}
      OTEL_TRACES_SAMPLER_ARG: ${{ vars.OTEL_TRACES_SAMPLER_ARG }}
      SEED_DEV: "false"
      # Temporary, for a performance-test window: POST /telemetry (see
      # api/internal/api/telemetry.go). Flip back to "false" and redeploy when
      # the test is done — no code change needed either direction.
      TELEMETRY_ENABLED: "true"
      # AV1 kill switch (api/internal/config AV1Publish): off | meetings | on. Unset = off.
      # For an instant flip without a deploy: gcloud run services update --update-env-vars.
      AV1_PUBLISH: ${{ vars.AV1_PUBLISH }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy guard (wait while anything is live)
        env:
          GUARD_SCOPE: any
          GUARD_MODE: api
          API_BASE: ${{ vars.LIVE_STATUS_API_BASE }}
          FORCE: ${{ inputs.force == true || vars.DEPLOY_GUARD_SKIP == 'true' || contains(github.event.head_commit.message, '[skip guard]') }}
        run: bash .github/scripts/wait-no-live.sh

      - name: Require DATABASE_URL (Supabase)
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Set repository secret DATABASE_URL to a Supabase URI with sslmode=require (see deploy/SUPABASE.md)." >&2
            exit 1
          fi
          if [ -z "${SESSION_SECRET}" ]; then
            echo "Set repository secret SESSION_SECRET." >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # gcloud is preinstalled on ubuntu-latest; skip the ~25s download and use it.
      # The auth step above still provides the credentials.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Deploy
        run: chmod +x deploy/cloudrun-deploy.sh && ./deploy/cloudrun-deploy.sh
