# Build the Android and iOS apps (apps/mobile, Capacitor). Builds only: nothing is uploaded
# to Google Play or App Store Connect from here. See apps/mobile/README.md.
#
# Triggers:
#   - workflow_dispatch (Actions tab)
#   - push to main touching apps/mobile/** or this file
#   - pull requests touching the same paths
#
# Always produced (no secrets needed):
#   webinarliv-android-debug     app-debug.apk, installable with `adb install`
#   webinarliv-ios-simulator     App.app for the iOS Simulator (`xcrun simctl install`)
#
# Produced only when the signing secrets exist (repo Settings -> Secrets -> Actions):
#   webinarliv-android-release   app-release.aab, signed for Play upload
#     ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   webinarliv-ios-ipa           App.ipa exported for App Store Connect
#     APPLE_TEAM_ID              10-character Team ID
#     and EITHER manual signing:
#       IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution certificate (.p12)
#       IOS_DIST_CERT_PASSWORD        its export password
#       IOS_PROVISIONING_PROFILE_BASE64  base64 of the App Store profile for com.webinarliv.app
#     OR automatic signing with an App Store Connect API key:
#       APP_STORE_CONNECT_API_KEY_ID
#       APP_STORE_CONNECT_API_ISSUER_ID
#       APP_STORE_CONNECT_API_KEY_P8_BASE64   base64 of the AuthKey_XXXX.p8
#
# Optional, for push in the built apps (Firebase Cloud Messaging; never committed):
#   GOOGLE_SERVICES_JSON_BASE64       base64 of Firebase's google-services.json (Android)
#   GOOGLE_SERVICE_INFO_PLIST_BASE64  base64 of Firebase's GoogleService-Info.plist (iOS)

name: mobile-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      - name: google-services.json (optional)
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      - name: assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: webinarliv-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: bundleRelease
        if: env.HAS_ANDROID_SIGNING == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_ANDROID_SIGNING == 'true'
        with:
          name: webinarliv-android-release
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_MANUAL_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_ASC_KEY: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' }}
      HAS_GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      # The "Copy Firebase config" build phase bundles it when present; without it push is off.
      - name: Firebase config (iOS push)
        if: env.HAS_GOOGLE_SERVICE_INFO == 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist
      - run: xcodebuild -version
      - name: Simulator build (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          cd "$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator" && zip -qry "$RUNNER_TEMP/WebinarLiv-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: webinarliv-ios-simulator
          path: ${{ runner.temp }}/WebinarLiv-simulator.zip
          if-no-files-found: error

      # ---- signed archive + export, only with secrets --------------------------------
      - name: Signing material (manual)
        if: env.HAS_MANUAL_SIGNING == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Signing material (App Store Connect API key)
        if: env.HAS_MANUAL_SIGNING != 'true' && env.HAS_ASC_KEY == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and export
        if: env.HAS_MANUAL_SIGNING == 'true' || env.HAS_ASC_KEY == 'true'
        working-directory: apps/mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          ARCHIVE="$RUNNER_TEMP/WebinarLiv.xcarchive"
          if [ "$HAS_MANUAL_SIGNING" = "true" ]; then
            # Manual signing on the App target only. On the command line it would also hit
            # the Swift packages, which refuse a provisioning profile and fail the archive.
            sed -i '' "s|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";|" App.xcodeproj/project.pbxproj
            AUTH_ARGS=()
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.webinarliv.app</key><string>${PROFILE_NAME}</string></dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          else
            AUTH_ARGS=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          fi
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${AUTH_ARGS[@]+"${AUTH_ARGS[@]}"} archive | tail -n 40
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" ${AUTH_ARGS[@]+"${AUTH_ARGS[@]}"} | tail -n 40
      - uses: actions/upload-artifact@v4
        if: env.HAS_MANUAL_SIGNING == 'true' || env.HAS_ASC_KEY == 'true'
        with:
          name: webinarliv-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
