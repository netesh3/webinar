# Point live.webinarliv.com at the SFU box, proxied by Cloudflare.
#
# This is the switch that makes the low-latency attendee path scale. MediaMTX
# and the Caddy route ship with the SFU already; what is missing until this runs
# is an edge in front of them. Without the orange cloud the origin sends one
# copy of every HLS part per viewer off a 1 Gbps NIC, which is why the API keeps
# attendees on the B2 playlist until BROADCAST_HLS_BASE is set.
#
# Idempotent: creates the record, or updates it if it already exists.
#
# Needs a token with Zone:DNS:Edit on webinarliv.com, as CLOUDFLARE_DNS_API_TOKEN.
# CLOUDFLARE_API_TOKEN is tried as a fallback and is expected to fail: the Workers
# deploy token can read the zone but not write records, which comes back as a bare
# "Authentication error" on the create call. Adding the record in the dashboard is
# equivalent — this workflow exists so the step is repeatable, not because it is
# the only way.

name: Live origin DNS

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Hostname to create"
        required: true
        default: "live.webinarliv.com"
      target:
        description: "Origin IPv4 (the SFU box)"
        required: true
        default: "88.198.141.104"

concurrency:
  group: live-origin-dns

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      HOSTNAME: ${{ inputs.hostname }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Create or update the proxied A record
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set on this repository." >&2
            exit 1
          fi

          # The zone is the last two labels of the hostname.
          zone_name="$(echo "${HOSTNAME}" | awk -F. '{print $(NF-1)"."$NF}')"

          api() { curl -sS -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" "$@"; }

          zone_resp="$(api "https://api.cloudflare.com/client/v4/zones?name=${zone_name}")"
          if [ "$(echo "$zone_resp" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare refused the zone lookup — the token most likely lacks Zone:Read/DNS:Edit." >&2
            echo "$zone_resp" | jq -r '.errors' >&2
            exit 1
          fi

          zone_id="$(echo "$zone_resp" | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "No zone named ${zone_name} is visible to this token." >&2
            exit 1
          fi

          existing="$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=A&name=${HOSTNAME}" \
            | jq -r '.result[0].id // empty')"

          body="$(jq -nc --arg name "${HOSTNAME}" --arg content "${TARGET}" \
            '{type:"A", name:$name, content:$content, proxied:true, ttl:1}')"

          if [ -n "$existing" ]; then
            resp="$(api -X PUT "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${existing}" -d "$body")"
          else
            resp="$(api -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" -d "$body")"
          fi

          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            echo "$resp" | jq -r '.errors' >&2
            echo "If this is code 10000 on an otherwise working zone lookup, the token can read but not write DNS." >&2
            echo "Create one with Zone:DNS:Edit for ${zone_name} and store it as CLOUDFLARE_DNS_API_TOKEN." >&2
            exit 1
          fi
          echo "$resp" | jq -r '"\(.result.name) -> \(.result.content) proxied=\(.result.proxied)"'
