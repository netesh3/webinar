# Deploy the Go API image to Google Cloud Run.
#
# Secrets (repo Settings → Secrets, or `gh secret set NAME`):
#   DATABASE_URL      Supabase Postgres URI with sslmode=require (see deploy/SUPABASE.md)
#   SESSION_SECRET    >=32 random bytes
#   LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET
#     or LIVEKIT_PROJECTS (JSON) instead of the legacy trio
# Optional: CORS_ORIGINS, WEB_BASE_URL, GCP_PROJECT, GCP_REGION, …
#
# Requires: GCP credentials in the job (Workload Identity / WIF or a key secret)
# and Artifact Registry + Cloud Run permissions on the project.

name: Deploy API (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "deploy/cloudrun-deploy.sh"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT || 'ai-project-490516' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_PROJECTS: ${{ secrets.LIVEKIT_PROJECTS }}
      LIVEKIT_HTTP_URL: ${{ secrets.LIVEKIT_HTTP_URL }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require DATABASE_URL
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Set repository secret DATABASE_URL (Supabase URI with sslmode=require)." >&2
            exit 1
          fi
          if [ -z "${SESSION_SECRET}" ]; then
            echo "Set repository secret SESSION_SECRET." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Prefer Workload Identity Federation (vars/secrets set by maintainers).
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Fallback: set GCP_CREDENTIALS JSON secret and uncomment credentials_json.
          # credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: ./deploy/cloudrun-deploy.sh
