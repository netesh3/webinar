# Self-hosted stack. Every component is open source:
#   Postgres (PostgreSQL licence) · Redis (BSD-3) · LiveKit (Apache-2.0) · coturn (BSD)
#
# Local / self-host Postgres stays here. Production Cloud Run prefers Supabase —
# set DATABASE_URL to the Supabase URI (sslmode=require); see deploy/SUPABASE.md.
#
# This file is the deployment target for the full self-hosted stack. For local
# development on macOS see the Makefile: Docker Hub was rate-limiting/refusing
# manifests when this was built, so `make db` / Homebrew Postgres on :5432 and
# the natively-compiled LiveKit binary in infra/bin/ are the usual path. Same
# versions, same config shape.
#
# Sizing note: this file targets the 500-concurrent-attendee ceiling. Only the
# host and panelists publish, so the SFU's load is dominated by *egress* —
# ~500 subscribers x ~2 Mbps ~= 1 Gbps. One node with unmetered 1 Gbps handles
# that; past ~500 you add the LL-HLS tier rather than more SFU nodes.

name: webcast

services:
  postgres:
    # 16 rather than 18: Docker Hub was refusing to serve the 18 manifest when
    # this was set up, and 16 was already cached locally. Bump when convenient.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webcast
      POSTGRES_PASSWORD: webcast
      POSTGRES_DB: webcast
      # Deterministic collation so ORDER BY doesn't shift between machines
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5433:5432" # 5433 to avoid clashing with a local Homebrew postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcast -d webcast"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"           # signalling (WebSocket) + HTTP
      - "7881:7881"           # TCP fallback for ICE
      - "50000-50060:50000-50060/udp" # RTP/RTCP — without these you get black video
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
