# LiveKit Egress, Redis, and MediaMTX (the Edge HLS origin).
# Extends the base livekit-hetzner deployment.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.egress.yml up -d

services:
  # Ephemeral in-memory Redis for LiveKit <-> Egress psrpc protocol buffers RPC queue.
  # redis.conf is written by redeploy.sh: 127.0.0.1 only and no password by default (never
  # exposed to the internet); in remote-egress mode (EGRESS_REMOTE=true in .env) it also binds
  # the box's private IP, with a password, for the egress workers on the same VPC.
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

  # Live origin for Edge delivery: RTMP ingest from egress, plain HLS out through Caddy.
  # Host network like everything else here so egress can push rtmp://127.0.0.1.
  # The plain image: the -ffmpeg variant was for the WHEP audio transcode, now gone.
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      # rec/* recordings of the edge mix, collected by the mix recorder (docker-compose.mixrec.yml).
      - ./recordings:/recordings

  # LiveKit Egress worker: runs headless Chromium to render the Zoom-style template,
  # captures audio & video streams, encodes to H.264/MP4, and uploads directly to Backblaze B2.
  #
  # Not started in remote-egress mode: the composite then runs on worker VMs
  # (deploy/egress-worker), never on this box, so a mix cannot take the SFU's CPU.
  egress:
    image: livekit/egress:v1.15.0
    profiles: ["local-egress"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
      - mediamtx
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - /dev/shm:/dev/shm
