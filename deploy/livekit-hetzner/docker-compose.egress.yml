# LiveKit Egress, Redis, and MediaMTX (live WHEP origin).
# Extends the base livekit-hetzner deployment.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.egress.yml up -d

services:
  # Ephemeral in-memory Redis for LiveKit <-> Egress psrpc protocol buffers RPC queue.
  # Bound strictly to 127.0.0.1 with protected mode on (never exposed to the internet).
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--save", "", "--appendonly", "no"]

  # Live origin: RTMP ingest from egress, WHEP for attendees (HLS kept for debug).
  # Host network like everything else here so egress can push rtmp://127.0.0.1.
  mediamtx:
    image: bluenviron/mediamtx:1.12.2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  # LiveKit Egress worker: runs headless Chromium to render the Zoom-style template,
  # captures audio & video streams, encodes to H.264/MP4, and uploads directly to Backblaze B2.
  egress:
    image: livekit/egress:v1.14.1
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
      - mediamtx
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - /dev/shm:/dev/shm
