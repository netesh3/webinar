# Server-side live captions (deploy/captions). Opt-in: redeploy.sh adds this file only when
# /opt/livekit/.env has CAPTIONS_ENABLED=true (and CAPTIONS_SECRET). See deploy/captions/README.md.
#
# Video always wins. Three layers keep the caption agent from ever slowing LiveKit, egress
# or MediaMTX on this box:
#   cpus        a hard cap (CAPTIONS_CPUS, default 2 of a 4-vCPU box);
#   cpu_shares  256 against everyone else's 1024, so under contention it gets a quarter;
#   nice 10     inside the container (Dockerfile), and the in-process CPU guard, which steps
#               down the model and then pauses captions when the HOST is busy.
# And it is the first thing the kernel kills if memory runs out (oom_score_adj).
services:
  captions:
    image: ${CAPTIONS_IMAGE:-webinarliv-captions:local}
    build: ./captions
    network_mode: host
    restart: unless-stopped
    depends_on: [livekit]
    cpus: ${CAPTIONS_CPUS:-2}
    cpu_shares: 256
    mem_limit: ${CAPTIONS_MEMORY:-4g}
    oom_score_adj: 800
    # Written by redeploy.sh from .env and .env.keys (LiveKit key, CAPTIONS_*), mode 600.
    env_file: captions.env
    volumes:
      - captions_models:/models
      - captions_spool:/var/lib/captions
    stop_grace_period: 40s

volumes:
  captions_models:
  captions_spool:
