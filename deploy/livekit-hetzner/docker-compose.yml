# LiveKit-only stack for Hetzner (host networking for WebRTC UDP).
# Domain via sslip.io or a real DNS A record.

services:
  livekit:
    image: livekit/livekit-server:v1.9.1
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Caddy proxies to 127.0.0.1:7880. Start LiveKit first so the first WSS
  # clients after a reboot do not hit connection-refused during TLS obtain.
  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    depends_on: [livekit]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
