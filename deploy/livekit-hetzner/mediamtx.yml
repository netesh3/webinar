# Generated on the box by redeploy.sh from mediamtx.yml.template.
# Checked in so a local `docker compose` still has a valid default (no ICE IP).

logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
  # WHEP viewers arrive as their own address, not Caddy's — see the template.
  - user: any
    pass:
    permissions:
      - action: read

rtsp: no
rtmp: yes
rtmpAddress: 127.0.0.1:1935
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 60s
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcAllowOrigin: "*"
webrtcTrustedProxies: ["127.0.0.1"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []
srt: no
api: no
metrics: no
pprof: no
playback: no

paths:
  all_others:
