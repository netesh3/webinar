# Generated on the box by redeploy.sh from mediamtx.yml.template.
# Checked in so a local `docker compose` still has a valid default (no ICE IP).

logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
  # WHEP viewers arrive as their own address, not Caddy's — see the template.
  - user: any
    pass:
    permissions:
      - action: read

rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: true
rtmpAddress: 127.0.0.1:1935
hls: true
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 60s
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: ["127.0.0.1"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

paths:
  # RTMP ingest, transcoded to wrtc/{slug} for WHEP — see the template for why.
  "~^live/(.+)$":
    runOnAvailable: >
      ffmpeg -nostdin -hide_banner -loglevel warning
      -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
      -map 0:v:0 -c:v copy
      -map 0:a:0 -c:a libopus -b:a 96k -ar 48000 -ac 2 -application audio
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/wrtc/$G1
    runOnAvailableRestart: true

  all_others:
