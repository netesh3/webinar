# LiveKit SFU, single node, 500 attendees.
#
# The development copy is livekit.local.yaml; this one differs in three ways that
# matter, and each of them is a way a deployment breaks:
#
#   1. No keys. They arrive as LIVEKIT_KEYS from the environment, so no secret is
#      in this file or in git.
#   2. use_external_ip: true. The SFU has to advertise the address a browser can
#      actually reach it on. Left false behind NAT it hands out a private IP,
#      candidates never pair, and the symptom is a call that connects and then
#      shows black video.
#   3. TURN over UDP. The last resort for a client that cannot do either of the
#      above; see the note at the bottom about TURN/TLS on 443.

port: 7880 # signalling; Caddy terminates TLS in front of it

rtc:
  # Must match the published range in docker-compose.prod.yml, and must be open in
  # the server's firewall. A mismatch here is the single most common cause of
  # "everything looks connected but there is no video".
  port_range_start: 50000
  port_range_end: 50060
  # ICE over TCP, for the networks that block UDP outright. Roughly 15% of
  # corporate attendees need this to join at all.
  tcp_port: 7881
  # Discovered via STUN at startup. Set NODE_IP and pass --node-ip instead if the
  # server sits behind a NAT that STUN cannot see through (some cloud NAT gateways).
  use_external_ip: true

  # STUN servers, which the SFU also hands to every browser as its ICE server list.
  #
  # Without this the browser has no way to learn its own public address, so it
  # offers only host candidates — its LAN IPs, useless to anything outside the LAN.
  # The SFU then has to infer the client's address from an inbound packet, which
  # shows up in its logs as a `prflx` (peer-reflexive) candidate. That works only
  # while the direction the browser opened stays open, and it gives ICE nothing to
  # retry with when it does not.
  #
  # A server-reflexive candidate on both sides is what lets ICE pair addresses
  # deliberately instead of by accident, and it is one line.
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

redis:
  address: redis:6379

logging:
  level: info
  # JSON so a log shipper can index it, unlike the development config.
  json: true

# Room defaults for the webinar shape: a handful of publishers, many subscribers.
room:
  # Rooms are created by our API, which is what makes the attendee ceiling
  # enforceable. With auto-create on, any valid token conjures a room and the limit
  # becomes advisory.
  auto_create: false
  empty_timeout: 300 # tear down five minutes after the last participant leaves
  departure_timeout: 20
  max_participants: 505 # 500 attendees + host + panelists, a hard backstop

turn:
  enabled: true

  # The single most valuable thing in this file for time-to-first-frame, and it is
  # counter-intuitive: a relay makes connections *faster*, not slower.
  #
  # ICE spends its time discovering that paths do not work. Every failure costs a
  # timeout, and with no relay candidate there is nothing left to try afterwards —
  # so a client on a network where direct media cannot flow watches a blank stage
  # for tens of seconds while the browser retries, and may never connect at all.
  # A relay candidate is one that always works. ICE prefers a direct path when it
  # can prove one, and falls back in a single round trip when it cannot, instead of
  # timing out and starting over.
  #
  # This is the difference between "audio and video appear after two or three
  # minutes" and "after two seconds". If you change one thing here, change this.
  domain: ${TURN_DOMAIN}

  # UDP TURN. Cheap and covers a client whose network blocks peer-to-peer traffic
  # but allows outbound UDP to a fixed port. Publish 3478/udp to use it.
  udp_port: 3478

  # TURN over TLS on 443: the one thing that gets through a firewall allowing
  # nothing but HTTPS, which is a normal corporate configuration rather than an edge
  # case. It needs a certificate, and 443 is Caddy's — so the deployment gives TURN
  # its own hostname and Caddy hands over the certificate it already manages:
  #
  #   1. DNS: turn.example.com -> this server
  #   2. Caddy issues for it (see infra/Caddyfile) and writes the pair into a volume
  #      this container also mounts read-only.
  #   3. Uncomment below.
  #
  # Until that is wired, udp_port above plus rtc.tcp_port covers most networks, and
  # the ones it does not are exactly the ones that see the multi-minute delay.
  #
  # tls_port: 5349
  # cert_file: /certs/turn.crt
  # key_file: /certs/turn.key
