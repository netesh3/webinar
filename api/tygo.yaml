# Generates web/lib/api-types.ts from api/types/types.go.
#
# The Go structs are the single source of truth for the wire contract. Run
# `make types` after touching them; CI runs it and fails if the output differs,
# so the two halves cannot drift.
packages:
  - path: "github.com/netkumar/webcast/api/types"
    output_path: "../web/lib/api-types.ts"
    indent: "  "
    frontmatter: |
      /* eslint-disable @typescript-eslint/no-explicit-any */
      // Code generated by tygo from api/types/types.go. DO NOT EDIT.
      // Regenerate with: make types
    type_mappings:
      time.Time: "string"
