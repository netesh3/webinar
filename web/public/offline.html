<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5cff">
  <title>You're offline — Webinar Liv</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fa; color: #131619;
    }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 1rem 0 .25rem; }
    p { color: #5c6670; margin: 0 0 1.25rem; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #0b5cff; border: 0;
      border-radius: 10px; padding: .65rem 1.2rem; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d11; color: #eceef1; }
      p { color: #a4abb3; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Webinar Liv needs a connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
